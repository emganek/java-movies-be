spring.application.name=MovieJava

# Keep column/table names exactly as written (no camelCase -> snake_case)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

server.tomcat.max-part-count=50

spring.datasource.url=jdbc:mysql://localhost:3307/movies_en
jakarta.persistence.jdbc.url=jdbc:mysql://localhost:3307/movies_en
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.gravin.MovieJava=DEBUG

app.bootstrap.admin-initialization-enabled=true
app.bootstrap.admin-username=admin
app.bootstrap.admin-password=admin123

app.security.cors.allowed-origins=http://localhost:3000
app.security.jwt.secret=${JWT_SECRET:4PKQdHfJ7sH4qYQhJvB0f4r3A5Ol2fN8D0X0+JtDg2g=}
app.security.jwt.access-token-ttl=15m
app.security.jwt.refresh-token-ttl=7d
app.security.jwt.issuer=https://my-java-project.com.vn
app.security.refresh-token.name=refresh_token
app.security.refresh-token.path=/api/v1/auth
app.security.refresh-token.domain=
app.security.refresh-token.secure=true
app.security.refresh-token.same-site=None

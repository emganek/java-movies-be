spring.application.name=MovieJava

# Keep column/table names exactly as written (no camelCase -> snake_case)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

server.tomcat.max-part-count=50

spring.datasource.url=jdbc:mysql://localhost:3307/movies_en
jakarta.persistence.jdbc.url=jdbc:mysql://localhost:3307/movies_en
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG